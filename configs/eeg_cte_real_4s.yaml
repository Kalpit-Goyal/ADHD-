# Paper-faithful CTE-Net configuration (4-second / 512-sample / 50% overlap)
#
# Follows Gomez-Rivera et al. (2026), Sensors 26(18):5786 as closely as the
# available IEEE DataPort dataset permits.
#
# Deviations from the paper (documented, see RESULTS.md):
#   1. Channel order: paper uses [Fz, Cz, Pz, C3, T3, C4, T4, Fp1, Fp2, F3,
#      F4, F7, F8, P3, P4, T5, T6, O1, O2]; dataset stores
#      [Fp1, Fp2, F3, F4, C3, C4, P3, P4, O1, O2, F7, F8, T7, T8, P7, P8, Fz,
#      Cz, Pz]. No reordering is applied (pipeline-level choice).
#   2. Preprocessing: paper uses raw EEG without filtering/ICA. This config
#      disables band-pass and notch filtering but retains z-score rejection
#      because the .npy data uses an undocumented int16 scale.
#   3. Window length: 4s at 128 Hz = 512 samples (matches paper).
#   4. Overlap: 50% (matches paper).
data:
  root: data/real
  manifest: manifest.csv
  n_channels: 19
  fs: 128
  epoch_seconds: 4.0
  overlap: 0.5
  # Paper uses raw EEG without filtering; disabled for paper-faithful protocol.
  bandpass: null
  notch: null
  # Dataset stores int16 values in undocumented scale; microvolt threshold
  # disabled. Z-score rejection used for post-hoc quality screening.
  max_abs_uv: null
  max_abs_z: 10.0
  connectivity: var_coefficient
  var_order: 5

features:
  bands:
    delta: [1.0, 4.0]
    theta: [4.0, 8.0]
    alpha: [8.0, 13.0]
    beta: [13.0, 30.0]
    gamma: [30.0, 45.0]

model:
  name: ctenet_original
  d_model: 128
  n_heads: 1
  n_layers: 1
  dropout: 0.5
  eegnet_f1: 8
  eegnet_d: 2
  eegnet_f2: 16
  eegnet_kernel: 64

training:
  n_splits: 5
  val_size: 0.2
  batch_size: 32
  epochs: 60
  patience: 12
  lr: 0.001
  weight_decay: 0.0001
  seed: 42
  num_workers: 0
  device: cuda

output:
  dir: results/cte_net_real_4s
